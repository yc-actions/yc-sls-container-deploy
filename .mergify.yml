pull_request_rules:
    - name: Automatically approve and merge Dependabot PRs
      conditions:
          - base=main
          - author=dependabot[bot]
          - check-success=Check dist/
          - check-success=TypeScript Tests
          - check-success=Bundle Smoke Test
          - -title~=(WIP|wip)
          - -label~=(blocked|do-not-merge)
          - -merged
          - -closed
      actions:
          review:
              type: APPROVE
          merge:
              method: squash
